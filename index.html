<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost on the Trail — A Text Adventure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0d0c0b; --fg:#e8e2d4; --dim:#8a8378; --line:#2a2622;
    --accent:#d9a441; --death:#d0533f; --win:#7cc47f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    font-size:17px; line-height:1.7;
    background:radial-gradient(ellipse at 50% 30%,#1c1815 0%,#0d0c0b 70%) fixed;
  }
  .wrap{max-width:720px;margin:0 auto;padding:40px 24px 60px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:32px;
    font-size:12px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
  header h1{font-size:12px;margin:0;color:var(--accent);font-weight:600;letter-spacing:.2em}
  #screen{flex:1;cursor:default}
  .line{margin:0 0 .3em;opacity:0;transform:translateY(4px);transition:opacity .45s ease,transform .45s ease;white-space:pre-wrap}
  .line.show{opacity:1;transform:none}
  .line.blank{min-height:.9em}
  .line.loading{color:var(--dim);letter-spacing:.12em}
  .line.question{color:var(--accent);margin-top:.9em}
  .line.err{color:var(--death)}
  .line.echo{color:var(--dim)}
  .line.gameover{color:var(--death);font-weight:700;letter-spacing:.2em;margin-top:1.2em}
  .line.victory{color:var(--win);font-weight:700;letter-spacing:.2em;margin-top:1.2em}
  .line.theend{color:var(--accent);font-weight:700;letter-spacing:.2em;margin-top:1.2em}
  #controls{margin-top:28px;opacity:0;transition:opacity .3s;pointer-events:none}
  #controls.show{opacity:1;pointer-events:auto}
  .choices{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  button{font:inherit;font-size:15px;background:transparent;color:var(--fg);
    border:1px solid #4a443c;padding:8px 20px;cursor:pointer;border-radius:2px;transition:border-color .15s,color .15s,background .15s}
  button:hover,button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;background:rgba(217,164,65,.06)}
  form{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
  form span{color:var(--accent)}
  input{flex:1;font:inherit;background:transparent;border:none;color:var(--fg);outline:none;caret-color:var(--accent);min-width:0}
  input::placeholder{color:#544d44}
  .found{font-size:13px;color:var(--dim);margin-top:4px}
  footer{margin-top:40px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:12px}
  footer button{font-size:12px;padding:4px 12px}
  .skip-hint{font-size:12px;color:#544d44;margin-top:18px;transition:opacity .3s}

  /* ---------- illustrations ---------- */
  #art{aspect-ratio:500/190;border:1px solid var(--line);margin-bottom:28px;overflow:hidden;background:#000;
    opacity:0;transition:opacity .9s ease;box-shadow:0 20px 50px -20px #000}
  #art.show{opacity:1}
  #art{position:relative}
  #art canvas{display:block;width:100%;height:100%}
  #art.is3d{aspect-ratio:2/1}
  .art3d{position:relative;width:100%;height:100%}
  .art3d .caption{position:absolute;left:14px;top:10px;font-size:11px;letter-spacing:.16em;color:rgba(220,220,205,.85);text-shadow:0 1px 4px #000;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lost on the Trail</h1>
    <span>a text adventure</span>
  </header>

  <div id="art" aria-hidden="true"></div>
  <main id="screen" aria-live="polite"></main>
  <div class="skip-hint" id="skipHint">click or press any key to skip ahead</div>

  <div id="controls">
    <div class="choices" id="choices"></div>
    <form id="form" autocomplete="off">
      <span>&gt;</span>
      <input id="field" type="text" aria-label="Type your answer">
    </form>
  </div>

  <footer>
    <span id="tally"></span>
    <button type="button" id="restartBtn">Restart</button>
  </footer>
</div>

<script>
/* ============================================================
   STORY DATA
   Each scene has:
     text     – lines to show (array, or function(state) → array)
     choices  – buttons; keys are what you can type instead
     err      – message when the typed answer isn't recognised
     fallback – where unrecognised typed input goes instead of err
     cont     – a "Continue" scene (like "Press any key")
     ending   – marks a final scene (id is used for the endings tally)
     enter    – runs when the scene starts (used for the 50/50 roll)
   A choice can also have:
     say – lines carried onto the next screen
     set – values to store (e.g. hasObject)
   ============================================================ */

const GAME_OVER = "GAME OVER . . .";
const c = (label, keys, next, extra = {}) => ({ label, keys, next, ...extra });
const YES = ["yes", "y"], NO = ["no", "n"];
const CELLAR = ["You fall into the cellar and die.", "GAME OVER. . ."];

const S = {};

/* ---------- tutorial ---------- */

  fallback: "pressAny"

S.tut = {
  text: [
    "This is a story game, where you can respond with simple one letter answers.",
    "Each path will lead you down a different path.",
    "",
    "TUTORIAL STORY LOADING. . .",
    "",
    "You find yourself trapped in your burning house.",
    "To your left you see a gap large enough to fit you, however the path to it is swallowed in flames.",
    "To you right you see a broken window, but its much further away.",
    "Do you take the left path or right path?"
  ],
  choices: [
    c("Left", ["left", "l"], "pressAny", { say: [
      "You sprint across the room, fire licking your whole body.",
      "You attempt to leap through, however instead you slam into the wall at full speed.",
      "Conciousness rapidly exits your body, as you are claimed by the flames.",
      "", "Tutorial complete. . .", ""
    ]}),
    c("Right", ["right", "r"], "pressAny", { say: [
      "You sprint full speed, trying to get to the window before the flames claim it.",
      "You leap through bracing yourself. Although you are left with many bad cuts from the glass.",
      "You have successfully escaped.",
      "", "Tutorial complete. . .", ""
    ]})
  ],
  err: "um hello excuse me? type left or right please please please"
};

S.pressAny = { text: ["Press any key to continue:"], cont: "story" };

/* ---------- the actual story ---------- */

/* ---------- LEFT path ---------- */
S.L1 = {

    "You see the headlights of a car approaching you. Do you start running? (y/n)"
  ],

S.L_run = {

    "Do you try to fight off the monster behind you, or keep running? (fight/run)"
  ],

S.L_fight = {

  ],

S.F_go = {

/* ---------- RIGHT path ---------- */
S.R1 = {
  text: [
    "You end up going right, and find yourself in front of large iron gates.",
    "Do you push open the gates, or turn around and try the other path? (push/turn)"
  ],
  choices: [
    c("Push", ["push", "p"], "R_gates"),
    c("Turn", ["turn", "t"], "L1", { say: ["You turn around and head back to try the other path."] })
  ],
  err: "??????\nPlease input push or turn"
};

S.R_gates = {
  text: [
    "You pass through the gates and find a manor, covered in spiderwebs and the sounds of rats climbing the walls.",
    "You walk up the old concrete steps to the wooden door.",
    "You knock once with no answer, and decide to go in because the wind is picking up.",
    "Do you slowly open the door? (y/n)"
  ],
  choices: [
    c("Yes", YES, "R_obj", { say: ["You slowly open the door, peeking inside before you enter the manor, its creaking echoing in the room."] }),
    c("No", NO, "R_obj", { say: ["You kick open the door, watching it split in two as it hits the ground.", "You overestimated how strong the door would be."] })
  ],
  err: "??????\nPlease input y or n"
};

S.R_obj = {
  text: [
    "You walk in to find a glowing object brightly illuminating the chamber.",
    "Do you pick it up, or leave it be? (pick/leave)"
  ],
  choices: [
    c("Pick", ["pick", "p"], "R_dark", { set: { hasObject: true },
      say: ["You pick up the object, holding it close to your chest, and find its warmth to be comforting."] }),
    c("Leave", ["leave", "l"], "R_dark", { say: ["You ignore it, not thinking of it as anything important."] })
  ],
  err: "??????\nPlease input pick or leave"
};

S.R_dark = {
  text: s => s.hasObject
    ? ["You enter the next room, only to find you can't see what's ahead of you. The room is pitch black.",
       "The glowing object provides a little light for you as you walk through the room.",
       "", "Press Enter to continue..."]
    : ["You enter the next room, only to find you can't see what's ahead of you. The room is pitch black.",
       "You place your hands on the wall, tracing your fingers across it as you walk through the room,",
       "only to still bump into something that falls and shatters at your feet.",
       "Do you try to step over it, or walk around it? (step/around)"],
  cont: s => s.hasObject ? "R_dim" : null,
  choices: s => s.hasObject ? null : [
    c("Step", ["step", "s"], "R_press", { say: [
      "You try to step over the shattered pieces, only to land a foot on a fragment.",
      "You wince in pain, but you manage to get over all the pieces."] }),
    c("Around", ["around", "a"], "R_press", { say: [
      "You are able to walk around the shattered pieces without injuring yourself."] })
  ],
  err: "??????\nPlease input step or around"
};

S.R_press = { text: ["", "Press Enter to continue..."], cont: "R_dim" };

    "and the faint sound of water dripping onto the floor.",
    "You aimlessly wander the room, not sure what you're looking for.",
    ...(s.fell ? CELLAR : [
      "Rounding the corner, you stop right in front of a pile of boxes.",
      "Do you move them and continue this path, or turn around? (move/turn)"])
  ],

  ending: s => s.fell ? "cellar" : null,
  err: "??????\nPlease input move or turn"
};

S.R_move = {

    "Thankfully, he seems to be asleep.",

  ],
  ending: "chained"
};

  ],
  choices: [c("Yes", YES, "R_vent"), c("No", NO, "R_noVent")],
  err: "??????\nPlease input y or n"
};

S.R_vent = {

  ],
  choices: [c("Back", ["back", "b"], "R_back"), c("Enter", ["enter", "e"], "R_room")],
  err: "??????\nPlease input back or enter"
};

S.R_back = { text: ["You crawl back up out of the vent.", ...CELLAR], ending: "cellar" };

S.R_room = {
  text: s => [
    "You enter the room, careful not to wake up the beast.",
    "You quickly realize there is nothing to be found here other than the creature",
    "and a second glowing object next to it.",
    ...(s.hasObject ? ["The one from earlier reacts strongly to the second one."] : []),
    "Do you leave, or try to grab the other object? (leave/grab)"
  ],
  choices: [
    c("Leave", ["leave", "l"], "R_leave"),
    c("Grab", ["grab", "g"], s => s.hasObject ? "R_swap" : "R_boom")
  ],

};

S.R_leave = {

  ],

};

  ],

};

S.R_boom = {

S.R_noVent = {

const ALL_ENDINGS = ["fight", "exhausted", "bazooka", "ambush", "applesauce", "starve",
                     "cellar", "chained", "garganshmargels", "swap", "boom", "vent"];

/* ============================================================
   ILLUSTRATIONS — ported from SceneIllustration.java,
   OutdoorScenePainter.java and IndoorScenePainter.java
   ============================================================ */
const Illustration = (() => {
  const W = 500, H = 190;                       // setPreferredSize(500, 190)
  const C = (r, g, b, a = 255) => `rgba(${r},${g},${b},${a / 255})`;
  const canvas = document.createElement("canvas");
  canvas.width = W * 2; canvas.height = H * 2;
  const ctx = canvas.getContext("2d");

  /* A tiny stand-in for Java's Graphics2D */
  function makeG() {
    let color = "#000", lw = 1, cap = "square", join = "miter";
    const stroke = () => { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = cap; ctx.lineJoin = join; };
    const ell = (x, y, w, h) => { ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); };
    return {
      setColor(c) { color = c; },
      setStroke(w, round = false) { lw = w; cap = round ? "round" : "square"; join = round ? "round" : "miter"; },
      fillRect(x, y, w, h) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); },
      drawRect(x, y, w, h) { stroke(); ctx.strokeRect(x, y, w, h); },
      drawLine(x1, y1, x2, y2) { stroke(); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); },
      fillOval(x, y, w, h) { ctx.fillStyle = color; ell(x, y, w, h); ctx.fill(); },
      drawOval(x, y, w, h) { stroke(); ell(x, y, w, h); ctx.stroke(); },
      fillPolygon(xs, ys) { ctx.fillStyle = color; ctx.beginPath(); xs.forEach((x, i) => i ? ctx.lineTo(x, ys[i]) : ctx.moveTo(x, ys[i])); ctx.closePath(); ctx.fill(); },
      drawArc(x, y, w, h, start, extent) {        // Java angles: degrees, counter-clockwise
        stroke(); ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, -start * Math.PI / 180, -(start + extent) * Math.PI / 180, extent > 0);
        ctx.stroke();
      },
      drawString(s, x, y) { ctx.fillStyle = color; ctx.font = "12px sans-serif"; ctx.fillText(s, x, y); }
    };
  }

  const fillBackground = (g, w, h, c) => { g.setColor(c); g.fillRect(0, 0, w, h); };
  const drawCaption = (g, s) => { g.setColor(C(220, 220, 205)); g.drawString(s, 14, 18); };

  /* ---------------- OutdoorScenePainter ---------------- */
  const Outdoor = {
    paint(g, width, height, scene) {
      switch (scene) {
        case "START": return this.drawTrail(g, width, height);
        case "GATES": return this.drawGates(g, width, height);
        case "HATCHET_FIGHT": return this.drawHatchetEncounter(g, width, height);
        case "FOREST_DASH": case "FOREST_LEAVE_NOW": case "FOREST_WAIT":
        case "FOREST_LEAVE_QUIETLY": case "FOREST_BREAK_RUN":
          return this.drawWoods(g, width, height);
        case "CROSS_STREET": case "WALK": return this.drawCreatureOnRoad(g, width, height);
        case "KEEP_SPRINTING": case "LEFT_ROAD": case "RUN": case "KEEP_RUNNING": case "WOODS_PATH_CHOICE":
          return this.drawRoad(g, width, height);
      }
    },
    drawTrail(g, width, height) {
      fillBackground(g, width, height, C(19, 35, 33));
      g.setColor(C(54, 74, 57));
      g.fillOval(-60, -35, 190, 160);
      g.fillOval(20, 15, 150, 140);
      g.fillOval(width - 150, -30, 200, 180);
      g.setColor(C(110, 93, 68));
      g.fillPolygon([width / 2 - 25, width / 2 + 25, width + 40, -40], [height / 2, height / 2, height, height]);
      g.setColor(C(142, 131, 105));
      g.drawLine(width / 2, height / 2 + 10, width / 2, height);
      drawCaption(g, "THE TRAIL");
    },
    drawGates(g, width, height) {
      fillBackground(g, width, height, C(30, 42, 48));
      const gateWidth = Math.min(250, width - 70);
      const left = Math.floor((width - gateWidth) / 2), top = 25, bottom = height - 25;
      g.setColor(C(95, 91, 82));
      g.fillRect(left - 14, top - 8, 14, bottom - top + 8);
      g.fillRect(left + gateWidth, top - 8, 14, bottom - top + 8);
      g.setColor(C(18, 21, 24));
      g.fillRect(left, top, gateWidth, bottom - top);
      g.setColor(C(125, 128, 125));
      g.setStroke(4);
      g.drawRect(left, top, gateWidth, bottom - top);
      for (let x = left + 18; x < left + gateWidth; x += 28) {
        g.drawLine(x, top + 3, x, bottom);

  const FAST = ["RUN", "KEEP_RUNNING", "KEEP_SPRINTING", "FOREST_DASH", "FOREST_BREAK_RUN"];
  const WITH_PERSON = ["RUN", "KEEP_RUNNING", "KEEP_SPRINTING", "WALK", "FOREST_DASH", "FOREST_BREAK_RUN"];

  let scene = "START", personX = 45, step = 0, timer = null;

  function drawPerson(g, holdingLamp) {
    const groundY = H - 30, bodyY = groundY - 55, stride = step % 2 === 0 ? 8 : -8;
    g.setStroke(4, true);
    g.setColor(C(235, 235, 240));
    g.drawOval(personX - 8, bodyY - 20, 16, 16);
    g.drawLine(personX, bodyY - 4, personX, bodyY + 22);
    g.drawLine(personX, bodyY + 3, personX - 12, bodyY + 15);
    if (holdingLamp) {
      const lampX = personX + 16, lampY = bodyY + 10;
      g.drawLine(personX, bodyY + 3, lampX, lampY);
      g.setColor(C(255, 244, 190));
      g.fillOval(lampX - 5, lampY - 5, 10, 10);
    } else {
      g.drawLine(personX, bodyY + 3, personX + 12, bodyY + 15);
    }
    g.drawLine(personX, bodyY + 22, personX - 10 + stride, groundY);
    g.drawLine(personX, bodyY + 22, personX + 10 - stride, groundY);
  }

  function paint() {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.fillStyle = C(25, 30, 45); ctx.fillRect(0, 0, W, H);   // setBackground
    const g = makeG();
    if (OUTDOOR.includes(scene)) Outdoor.paint(g, W, H, scene);
    else Indoor.paint(g, W, H, scene, personX);
    if (WITH_PERSON.includes(scene)) drawPerson(g, false);
    else if (scene === "DARK_ROOM_WITH_LAMP") drawPerson(g, true);
  }

  function showScene(s) {
    if (timer) { clearInterval(timer); timer = null; }
    scene = s; personX = 45; step = 0;
    if (ANIMATED.includes(s)) {
      const speed = FAST.includes(s) ? 7 : 2;
      timer = setInterval(() => {
        personX += speed; step++;
        if (personX > W - 45) personX = 45;
        paint();
      }, 40);
    }
    paint();
  }

  return { canvas, showScene };
})();

/* ============================================================
   3D ILLUSTRATIONS (Three.js) — one small 3D set per Scene.

   ============================================================ */
const Illustration3D = (() => {
  if (!window.THREE) return null;
  const T = window.THREE;

  try { renderer = new T.WebGLRenderer({ antialias: true }); } catch (e) { return null; }

  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  const wrap = document.createElement("div");
  wrap.className = "art3d";
  wrap.appendChild(renderer.domElement);
  const cap = document.createElement("div");
  cap.className = "caption";
  wrap.appendChild(cap);

  const camera = new T.PerspectiveCamera(45, 2, 0.1, 600);
  const PI = Math.PI;
  let S3 = null, cfg = {}, t0 = performance.now(), personAnim = null;

  function resize() {
    const w = wrap.clientWidth || 720, h = wrap.clientHeight || 360;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  else window.addEventListener("resize", resize);

  /* ---------- small helpers ---------- */
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const R = (a, b) => a + rnd() * (b - a);

  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new T.CanvasTexture(c);
    t.encoding = T.sRGBEncoding;
    return t;
  }
  const glowTex = canvasTex(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.25, "rgba(255,255,255,.45)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  const brickTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#1c1b22"; g.fillRect(0, 0, w, h);
    for (let r = 0; r < 8; r++) for (let c = -1; c < 5; c++) {
      const x = c * 64 + (r % 2) * 32, y = r * 32;
      g.fillStyle = `hsl(250,5%,${30 + ((r * 7 + c * 13) % 9) * 2}%)`;
      g.fillRect(x + 2, y + 2, 60, 28);

  });
  brickTex.wrapS = brickTex.wrapT = T.RepeatWrapping;
  brickTex.repeat.set(4, 2);
  const woodTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = "#6a4a30"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(30,18,10,.45)";
    for (let i = 0; i < 15; i++) {
      const y = i * 9;
      g.beginPath(); g.moveTo(0, y + 2); g.bezierCurveTo(40, y + 5, 80, y - 2, 128, y + 3); g.stroke();
    }
    g.strokeStyle = "rgba(20,12,6,.7)"; g.lineWidth = 3; g.strokeRect(1, 1, 126, 126);

  const SHARED = new Set([glowTex, brickTex, woodTex]);

  const M = (color, o = {}) => new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.95, metalness: 0, flatShading: true }, o));
  const add = (obj, parent) => { (parent || S3).add(obj); return obj; };
  function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
    const m = new T.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    return add(m, parent);

  function glow(color, size, x, y, z, parent, opacity = 1) {

      blending: T.AdditiveBlending, depthWrite: false, fog: false }));

    s.position.set(x, y, z);
    return add(s, parent);
  }
  function plight(color, intensity, dist, x, y, z, parent, shadows = false) {
    const l = new T.PointLight(color, intensity, dist, 2);
    l.position.set(x, y, z);
    if (shadows) { l.castShadow = true; l.shadow.mapSize.set(512, 512); l.shadow.bias = -0.002; }
    return add(l, parent);
  }
  function gradientSky(top, bottom) {
    return canvasTex(2, 256, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);

  }
  function sky(top, bottom, fogColor, density) {
    S3.background = gradientSky(top, bottom);

  }
  function indoor(color, near, far) {
    S3.background = new T.Color(color);
    S3.fog = new T.Fog(color, near, far);
  }
  const hemi = (top, bottom, i) => add(new T.HemisphereLight(top, bottom, i));
  function moonLight(x, y, z, color = 0x8fa3d0, intensity = 0.6) {
    const d = new T.DirectionalLight(color, intensity);

    d.shadow.bias = -0.0015;

  function moon(x, y, z, r = 4) {

    m.position.set(x, y, z); add(m);

  function forest(n, x1, x2, z1, z2, reject = () => false, color) {
    let placed = 0, tries = 0;
    while (placed < n && tries < n * 6) {
      tries++;
      const x = R(x1, x2), z = R(z1, z2);
      if (reject(x, z)) continue;
      pine(x, z, R(4, 9), color); placed++;
    }
  }

  /* Your stick figure, in 3D. Faces +z; limbs swing with rotation.x. */
  function person(color = 0xebebf0, lamp = false) {
    const g = new T.Group();
    const m = new T.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.18, roughness: 0.7 });
    const limb = (len, r) => {
      const p = new T.Group();
      const c = new T.Mesh(new T.CylinderGeometry(r, r, len, 6), m);
      c.position.y = -len / 2; c.castShadow = true; p.add(c);
      return p;
    };
    const head = new T.Mesh(new T.SphereGeometry(0.17, 16, 12), m);
    head.position.y = 1.62; head.castShadow = true; g.add(head);
    const body = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.66, 6), m);
    body.position.y = 1.17; body.castShadow = true; g.add(body);
    const armL = limb(0.52, 0.04), armR = limb(0.52, 0.04), legL = limb(0.85, 0.045), legR = limb(0.85, 0.045);
    armL.position.set(0.06, 1.4, 0); armR.position.set(-0.06, 1.4, 0);
    legL.position.set(0.05, 0.86, 0); legR.position.set(-0.05, 0.86, 0);
    [armL, armR, legL, legR].forEach(l => g.add(l));
    if (lamp) {
      armR.rotation.x = -1.15;
      const o = new T.Group(); o.position.y = -0.56; armR.add(o);
      o.add(new T.Mesh(new T.SphereGeometry(0.08, 14, 10), new T.MeshBasicMaterial({ color: 0xfff4be })));
      glow(0xffd77a, 1.6, 0, 0, 0, o, 0.9);
      plight(0xffd27a, 2.4, 9, 0, 0, 0, o, true);
    }
    const anim = (t, speed) => {
      const sw = Math.sin(t * speed * 3.2) * (speed > 2 ? 0.9 : 0.45);
      legL.rotation.x = sw; legR.rotation.x = -sw;
      armL.rotation.x = -sw * 0.8;
      if (!lamp) armR.rotation.x = sw * 0.8;
      g.position.y = Math.abs(Math.sin(t * speed * 3.2)) * (speed > 2 ? 0.08 : 0.03);
    };
    return { g, head, body, armL, armR, legL, legR, anim };
  }

  /* The tree beast. Faces +z. */
  function creature(eyeColor = 0xffcf5a, { eyes = true, color = 0x24180f } = {}) {
    const g = new T.Group(); add(g);
    const m = M(color);
    mesh(new T.CylinderGeometry(0.42, 0.7, 3.2, 7), m, 0, 1.75, 0, g);
    for (const s of [-1, 1]) mesh(new T.CylinderGeometry(0.16, 0.3, 1.3, 6), m, s * 0.42, 0.5, 0, g).rotation.z = -s * 0.38;
    const head = mesh(new T.DodecahedronGeometry(0.55, 0), m, 0, 3.6, 0.05, g);
    head.scale.set(1, 1.25, 0.9);
    const branch = (parent, x, y, len, rz, rx, r) => {
      const b = new T.Group(); b.position.set(x, y, 0); b.rotation.set(rx, 0, rz); parent.add(b);
      const c = new T.Mesh(new T.CylinderGeometry(r * 0.45, r, len, 5), m);
      c.position.y = len / 2; c.castShadow = true; b.add(c);
      return b;
    };
    const armL = branch(g, -0.35, 2.75, 1.9, 1.95, 0.25, 0.16);
    const armR = branch(g, 0.35, 2.75, 1.9, -1.95, 0.25, 0.16);
    for (const a of [armL, armR]) { branch(a, 0, 1.75, 0.8, 0.6, 0, 0.07); branch(a, 0, 1.75, 0.8, -0.5, 0.3, 0.07); branch(a, 0, 1.2, 0.6, 0.9, 0, 0.06); }
    const antL = branch(g, -0.25, 4.05, 1.0, 0.5, 0, 0.08), antR = branch(g, 0.25, 4.05, 1.0, -0.5, 0, 0.08);
    branch(antL, 0, 0.7, 0.5, 0.8, 0, 0.04); branch(antR, 0, 0.7, 0.5, -0.8, 0, 0.04);
    const eyeParts = [];
    if (eyes) {
      const em = new T.MeshBasicMaterial({ color: eyeColor });
      for (const s of [-1, 1]) {
        eyeParts.push(mesh(new T.SphereGeometry(0.09, 10, 8), em, s * 0.2, 3.68, 0.5, g));
        eyeParts.push(glow(eyeColor, 0.9, s * 0.2, 3.68, 0.55, g, 0.9));
      }
      eyeParts.push(plight(eyeColor, 1.2, 7, 0, 3.7, 1.0, g));
    }
    const setEyes = on => eyeParts.forEach(e => (e.visible = on));
    return { g, armL, armR, head, setEyes };
  }

  function orb(color, x, y, z, r = 0.18, intensity = 2, dist = 9, shadows = false, parent) {
    const g = new T.Group(); g.position.set(x, y, z); add(g, parent);
    g.add(new T.Mesh(new T.SphereGeometry(r, 20, 14), new T.MeshBasicMaterial({ color })));
    const halo = glow(color, r * 10, 0, 0, 0, g, 0.85);
    const light = plight(color, intensity, dist, 0, 0, 0, g, shadows);
    return { g, halo, light };
  }

  function chain(ax, ay, az, bx, by, bz, mat) {
    const a = new T.Vector3(ax, ay, az), b = new T.Vector3(bx, by, bz);
    const dir = b.clone().sub(a), n = Math.floor(dir.length() / 0.12);
    const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(1, 0, 0), dir.clone().normalize());
    const geo = new T.TorusGeometry(0.06, 0.018, 5, 10);
    for (let i = 0; i <= n; i++) {
      const p = a.clone().lerp(b, i / n);
      p.y -= Math.sin(PI * i / n) * 0.25;               // a little sag
      const l = mesh(geo, mat, p.x, p.y, p.z);
      l.quaternion.copy(q);
      if (i % 2) l.rotateX(PI / 2);
    }
  }

  function beam(from, to, radius, color, opacity) {      // soft light shaft
    const a = new T.Vector3(...from), b = new T.Vector3(...to);
    const len = a.distanceTo(b);
    const c = new T.Mesh(new T.ConeGeometry(radius, len, 20, 1, true),
      new T.MeshBasicMaterial({ color, transparent: true, opacity, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, fog: false }));
    c.position.copy(a).add(b).multiplyScalar(0.5);
    c.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), a.clone().sub(b).normalize());
    return add(c);
  }

    mesh(new T.BoxGeometry(0.15, 2.4, 0.15), M(0x4a3522), 0, 1.2, 0, post);

    for (let i = 0; i < 34; i++) {

    const dx = 3.6, dz = -4;
    mesh(new T.CircleGeometry(0.7, 20), M(0x1a2230, { roughness: 0.1, metalness: 0.5, flatShading: false }), dx, 0.015, dz).rotation.x = -PI / 2;
    const drop = mesh(new T.SphereGeometry(0.04, 8, 6), new T.MeshBasicMaterial({ color: 0x9fb4c8 }), dx, 4.9, dz);
    const ring = mesh(new T.RingGeometry(0.1, 0.13, 24), new T.MeshBasicMaterial({ color: 0x9fb4c8, transparent: true }), dx, 0.03, dz);
    ring.rotation.x = -PI / 2;
    let ventEyes = null;
    if (vent) {
      const vz = -7.9;
      mesh(new T.BoxGeometry(1.7, 0.85, 0.1), M(0x16171a), 0.8, 0.5, vz);
      const metal = M(0x787873, { metalness: 0.6, roughness: 0.5 });
      mesh(new T.BoxGeometry(1.8, 0.08, 0.14), metal, 0.8, 0.94, vz);
      mesh(new T.BoxGeometry(1.8, 0.08, 0.14), metal, 0.8, 0.06, vz);
      for (let x = -0.6; x <= 0.61; x += 0.3) mesh(new T.BoxGeometry(0.06, 0.8, 0.14), metal, 0.8 + x, 0.5, vz);
      ventEyes = [glow(0xff3020, 0.12, 0.62, 0.55, vz + 0.02), glow(0xff3020, 0.12, 0.98, 0.55, vz + 0.02)];
    }
    if (boxes) {
      const crate = M(0x8a6a48, { map: woodTex });
      mesh(new T.BoxGeometry(1.6, 1.2, 1.2), crate, 0.6, 0.6, -3.6).rotation.y = 0.15;
      mesh(new T.BoxGeometry(1.1, 1, 1), crate, 2.0, 0.5, -3.1).rotation.y = -0.2;
      mesh(new T.BoxGeometry(1.1, 0.9, 1), crate, 1.1, 1.65, -3.7).rotation.y = 0.35;
    }
    return {
      pos: [0, 2.2, 3.6], look: [0, 1.5, -4], push: 0.03,
      tick: t => {
        const ph = (t * 0.55) % 1;
        drop.position.y = 4.9 - 4.88 * ph * ph;
        const rp = ph;                                   // ripple from the previous drop
        ring.scale.setScalar(1 + rp * 5);
        ring.material.opacity = 0.7 * (1 - rp);
        if (ventEyes) ventEyes.forEach(e => (e.visible = Math.sin(t * 0.8) > 0.6));
      }
    };
  }

  function cellar() {
    indoor(0x0b0909, 5, 18);
    room(12, 4.5, 9, M(0x7a6e66, { map: brickTex, flatShading: false }), M(0x241e1a), -2);
    add(new T.AmbientLight(0x6a5040, 0.18));
    const wood = M(0x6a5240, { map: woodTex });
    for (let x = -5.5; x <= 5.6; x += 2.2) mesh(new T.BoxGeometry(0.25, 4.5, 0.25), wood, x, 2.25, -6.35);
    for (let z = -6; z <= 1; z += 2.3) mesh(new T.BoxGeometry(12, 0.25, 0.25), wood, 0, 4.35, z);
    mesh(new T.CylinderGeometry(0.01, 0.01, 0.9, 4), M(0x222222), 0, 4.05, -3);
    mesh(new T.SphereGeometry(0.1, 12, 8), new T.MeshBasicMaterial({ color: 0xffcf8a }), 0, 3.55, -3);
    glow(0xffb070, 1.5, 0, 3.55, -3);
    const bulb = plight(0xffb070, 2.2, 14, 0, 3.4, -3, null, true);
    const man = person(0x8a8580); add(man.g);
    man.g.position.set(0, 0, -5.6);
    man.armL.rotation.z = 1.25; man.armR.rotation.z = -1.25;
    man.head.position.set(0, 1.56, 0.08);
    const metal = M(0x77777a, { metalness: 0.7, roughness: 0.4, flatShading: false });
    const hy = 1.4 - 0.52 * Math.cos(1.25), hx = 0.06 + 0.52 * Math.sin(1.25);
    chain(hx, hy, -5.6, 5.5, 1.7, -6.3, metal);
    chain(-hx, hy, -5.6, -5.5, 1.7, -6.3, metal);
    return {
      pos: [0, 1.8, 2], look: [0, 1.4, -5.6], drift: [0.4, 0.08],
      tick: t => {
        bulb.intensity = 2.0 + Math.sin(t * 13) * 0.15 + (Math.sin(t * 2.1) > 0.97 ? -1.6 : 0);
        man.body.scale.x = man.body.scale.z = 1 + Math.sin(t * 1.2) * 0.12;
      }
    };
  }

  function creatureRoom({ withOrb = false, flash = false } = {}) {
    indoor(0x060908, 5, 22);
    room(14, 5, 12, M(0x7f9a82, { map: brickTex, flatShading: false }), M(0x101410), -2);
    add(new T.AmbientLight(0x2a4a32, 0.45));
    mesh(new T.BoxGeometry(1.4, 0.1, 0.9), M(0x16171a), -3.5, 4.96, -1);
    beam([-3.5, 4.95, -1], [-3, 0, -0.5], 1, 0x9fc8b0, 0.04);
    plight(0x9fc8b0, 0.8, 8, -3.5, 4.5, -1);
    mesh(new T.IcosahedronGeometry(1.5, 1), M(0x1f2d22), 0, 0.6, -4.2).scale.set(1.3, 0.7, 1);
    const c = creature(null, { eyes: false, color: 0x2c402a });
    c.g.position.set(0, 0, -4.2);
    c.g.rotation.x = 0.12;
    c.armL.rotation.z = 1.35; c.armR.rotation.z = -1.35;
    let o = null, flashLight = null;
    if (withOrb) o = orb(0xa0ffe6, 3.2, 0.45, -2.6, 0.16, 1.8, 8);
    if (flash) flashLight = plight(0xffffff, 0, 30, 1.5, 1.5, -1);
    return {
      pos: [0, 2.2, 4], look: [0, 1.8, -3.5], push: 0.03,
      tick: t => {
        c.g.scale.y = 1 + Math.sin(t * 1.1) * 0.015;
        if (o) o.halo.material.opacity = 0.65 + Math.sin(t * 3) * 0.25;
        if (flashLight) {
          const f = Math.pow((Math.sin(t * 2.6) + 1) / 2, 3);
          flashLight.intensity = f * 9;
          renderer.toneMappingExposure = 1.15 + f * 1.6;
        }
      }
    };
  }

  function mineshaft({ jars = false } = {}) {
    nightOutdoors("#06070a", "#1d1a16", 0x191817, 0.04);
    ground(0x1a1712);
    const shape = new T.Shape();
    shape.moveTo(-16, -0.5);
    shape.bezierCurveTo(-9, 2, -5, 7.5, 0, 7.5);
    shape.bezierCurveTo(5, 7.5, 9, 2, 16, -0.5);
    shape.lineTo(-16, -0.5);
    const hole = new T.Path();
    hole.moveTo(-1.2, 0.02); hole.lineTo(1.2, 0.02); hole.lineTo(1.2, 2.6);
    hole.quadraticCurveTo(0, 3.1, -1.2, 2.6); hole.lineTo(-1.2, 0.02);
    shape.holes.push(hole);
    const hill = mesh(new T.ExtrudeGeometry(shape, { depth: 12, bevelEnabled: false, curveSegments: 10 }), M(0x574330), 0, 0, -12);
    hill.castShadow = false;
    mesh(new T.PlaneGeometry(3, 3.2), M(0x0a0806), 0, 1.5, -11.5).castShadow = false;
    const wood = M(0x6f573d, { map: woodTex });
    for (const s of [-1, 1]) mesh(new T.BoxGeometry(0.3, 3.2, 0.3), wood, s * 1.35, 1.6, 0.2);
    mesh(new T.BoxGeometry(3.4, 0.35, 0.4), wood, 0, 3.3, 0.2);
    const rail = M(0x55565a, { metalness: 0.7, roughness: 0.4 });
    for (const s of [-1, 1]) mesh(new T.BoxGeometry(0.06, 0.06, 15), rail, s * 0.45, 0.08, -4.5);
    for (let z = 2.5; z > -11; z -= 0.8) mesh(new T.BoxGeometry(1.3, 0.05, 0.18), wood, 0, 0.03, z);
    glow(0xffc878, 3, 0, 1.2, -6.5, null, 0.9);
    const inner = plight(0xffc070, 2.4, 12, 0, 1.3, -4.5, null, true);
    if (jars) {
      const glass = M(0xe6c26a, { emissive: 0x5a3a10, flatShading: false });
      const lid = M(0x9a3b2a);
      [[-0.6, -1.5], [0, -1.9], [0.6, -1.4], [-0.3, -2.6], [0.4, -2.9], [-0.7, -3.6], [0.2, -4.2]].forEach(([x, z], i) => {
        for (let k = 0; k < (i < 3 ? 2 : 1); k++) {
          mesh(new T.CylinderGeometry(0.14, 0.14, 0.34, 12), glass, x + k * 0.05, 0.17 + k * 0.36, z);
          mesh(new T.CylinderGeometry(0.15, 0.15, 0.06, 12), lid, x + k * 0.05, 0.37 + k * 0.36, z);
        }
      });
    }
    forest(70, -50, 50, -50, 4, (x, z) => (Math.abs(x) < 18 && z > -14) || (Math.abs(x) < 6 && z > -20));
    return {
      pos: [0, 2, 8], look: [0, 1.6, -3], push: 0.05,
      tick: t => { inner.intensity = 2.3 + Math.sin(t * 9) * 0.15 + Math.sin(t * 23) * 0.1; }
    };
  }

  /* ---------- Scene name → 3D set (same names as Scene.java) ---------- */
  const BUILD = {
    START: () => trail(),
    GATES: () => gates(),
    LEFT_ROAD: () => road({ dusk: true }),
    RUN: () => road(), KEEP_RUNNING: () => road(), WOODS_PATH_CHOICE: () => road(), KEEP_SPRINTING: () => road(),
    HATCHET_FIGHT: () => road({ creatureMode: "lurk" }),
    WALK: () => road({ creatureMode: "charge", lights: false }),
    CROSS_STREET: () => road({ creatureMode: "charge", lights: false }),
    FOREST_DASH: () => woods(), FOREST_WAIT: () => woods(), FOREST_LEAVE_QUIETLY: () => woods(), FOREST_BREAK_RUN: () => woods(),
    FOREST_LEAVE_NOW: () => woods({ descend: true }),
    MANOR_DOOR: () => manor(), LEAVE_MANOR: () => manor(),
    ENTER_MANOR: () => chamber(), DOOR_KICKED: () => chamber({ kicked: true }),
    DARK_ROOM_WITH_LAMP: () => darkRoom({ lamp: true }),
    DARK_ROOM_WITHOUT_LAMP: () => darkRoom(),
    STEP_OVER_SHARDS: () => darkRoom({ shards: true }), WALK_AROUND_SHARDS: () => darkRoom({ shards: true }),
    DIM_ROOM: () => dimRoom(), BOXES_CHOICE: () => dimRoom({ boxes: true }), VENT_DISCOVERY: () => dimRoom({ vent: true }),
    CELLAR: () => cellar(),
    VENT_CREATURE_CHOICE: () => creatureRoom(),
    CREATURE_ROOM: () => creatureRoom({ withOrb: true }),
    GRAB_SECOND_OBJECT: () => creatureRoom({ withOrb: true, flash: true }),
    MINESHAFT_ENTER: () => mineshaft({ jars: true }), MINESHAFT_IGNORE: () => mineshaft()
  };
  /* captions from your painters */
  const CAPTIONS = {
    START: "THE TRAIL", GATES: "IRON GATES", LEFT_ROAD: "EMPTY ROAD", RUN: "EMPTY ROAD", KEEP_RUNNING: "EMPTY ROAD",
    WOODS_PATH_CHOICE: "EMPTY ROAD", KEEP_SPRINTING: "EMPTY ROAD",
    HATCHET_FIGHT: "A SNARLING SHAPE AND A BROKEN HATCHET", WALK: "THE CREATURE CHARGES", CROSS_STREET: "THE CREATURE CHARGES",
    FOREST_DASH: "THE WOODS", FOREST_WAIT: "THE WOODS", FOREST_LEAVE_QUIETLY: "THE WOODS", FOREST_BREAK_RUN: "THE WOODS", FOREST_LEAVE_NOW: "THE WOODS",
    MANOR_DOOR: "THE OLD MANOR", LEAVE_MANOR: "THE OLD MANOR", ENTER_MANOR: "A GLOWING OBJECT", DOOR_KICKED: "A GLOWING OBJECT",
    DIM_ROOM: "THE DIM ROOM", BOXES_CHOICE: "A PILE OF BOXES", VENT_DISCOVERY: "A DUSTY VENT", CELLAR: "THE CELLAR",
    VENT_CREATURE_CHOICE: "A CREATURE IN THE ROOM", CREATURE_ROOM: "THE SLEEPING BEAST", GRAB_SECOND_OBJECT: "THE SLEEPING BEAST",
    MINESHAFT_ENTER: "A LIGHT DEEP IN THE MINESHAFT", MINESHAFT_IGNORE: "A LIGHT DEEP IN THE MINESHAFT"
  };
  const WITH_PERSON = ["RUN", "KEEP_RUNNING", "KEEP_SPRINTING", "WALK", "FOREST_DASH", "FOREST_BREAK_RUN"];
  const FAST = ["RUN", "KEEP_RUNNING", "KEEP_SPRINTING", "FOREST_DASH", "FOREST_BREAK_RUN"];

  function disposeScene(s) {
    s.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      ms.forEach(m => { if (m.map && !SHARED.has(m.map)) m.map.dispose(); m.dispose(); });
    });
    if (s.background && s.background.isTexture) s.background.dispose();
  }

  function showScene(name) {
    if (S3) disposeScene(S3);
    S3 = new T.Scene();
    seed = 7;
    personAnim = null;
    renderer.toneMappingExposure = 1.15;
    cfg = (BUILD[name] || BUILD.START)() || {};
    const lamp = name === "DARK_ROOM_WITH_LAMP";
    if (WITH_PERSON.includes(name) || lamp) {
      const p = person(0xebebf0, lamp);
      add(p.g);
      p.g.rotation.y = PI / 2;                          // face the way they walk (left → right, like the Java panel)
      const range = cfg.range || 8, speed = FAST.includes(name) ? 3.4 : 1.1;
      p.g.position.z = cfg.personZ != null ? cfg.personZ : 1;
      personAnim = t => { p.g.position.x = -range + ((t * speed) % (2 * range)); p.anim(t, speed); };
    }
    cap.textContent = CAPTIONS[name] || "";
    t0 = performance.now();
    last = t0;
    resize();
  }

  const look = new T.Vector3();
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    if (!S3 || document.hidden) return;
    const t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const d = cfg.drift || [0.5, 0.1], p = cfg.pos || [0, 2, 8], l = cfg.look || [0, 1, 0];
    camera.position.set(p[0] + Math.sin(t * 0.13) * d[0], p[1] + Math.sin(t * 0.17) * d[1], p[2] - Math.min(t, 25) * (cfg.push || 0));
    look.set(l[0], l[1], l[2]);
    camera.lookAt(look);
    if (cfg.tick) cfg.tick(t, dt);
    if (personAnim) personAnim(t);
    renderer.render(S3, camera);
  }
  requestAnimationFrame(loop);

  return { canvas: wrap, showScene, is3D: true };
})();

const ILL = Illustration3D || Illustration;

/* Which picture goes with which part of the story */
const SCENE_ART = {
  start: "START", tut: "START", pressAny: "START", story: "START",
  L1: "LEFT_ROAD", L_run: "RUN", L_fight: "HATCHET_FIGHT", L_keep: "KEEP_RUNNING",
  L_noPath: "WOODS_PATH_CHOICE", L_tough: "KEEP_SPRINTING", L_walk: "WALK", L_across: "CROSS_STREET",
  forest: "FOREST_DASH", F_leave: "FOREST_LEAVE_NOW", F_wait: "FOREST_LEAVE_QUIETLY",
  F_go: "MINESHAFT_ENTER", F_ignore: "MINESHAFT_IGNORE",
  R1: "GATES", R_gates: "MANOR_DOOR", R_obj: "ENTER_MANOR",
  R_dark: s => s.hasObject ? "DARK_ROOM_WITH_LAMP" : "DARK_ROOM_WITHOUT_LAMP",
  R_press: "STEP_OVER_SHARDS",
  R_dim: s => s.fell ? "CELLAR" : "BOXES_CHOICE",
  R_move: "CELLAR", R_boxTurn: "VENT_DISCOVERY", R_noVent: "VENT_DISCOVERY",
  R_vent: "VENT_CREATURE_CHOICE", R_room: "CREATURE_ROOM", R_back: "CELLAR",
  R_leave: "CELLAR", R_swap: "GRAB_SECOND_OBJECT", R_boom: "GRAB_SECOND_OBJECT"
};

/* ============================================================
   ENGINE
   ============================================================ */
const screen = document.getElementById("screen");
const controls = document.getElementById("controls");
const choicesEl = document.getElementById("choices");
const form = document.getElementById("form");
const field = document.getElementById("field");
const tally = document.getElementById("tally");
const skipHint = document.getElementById("skipHint");
const DELAY = 380;

let state, current, timers = [], animating = false;
const val = x => (typeof x === "function" ? x(state) : x);

function loadFound() {
  try { return new Set(JSON.parse(localStorage.getItem("lostTrail.endings") || "[]")); }
  catch (e) { return new Set(); }
}
function saveFound(set) {
  try { localStorage.setItem("lostTrail.endings", JSON.stringify([...set])); } catch (e) {}
}
let found = loadFound();
function updateTally() { tally.textContent = `Endings found: ${found.size} / ${ALL_ENDINGS.length}`; }

function classify(text) {
  if (text === "") return "blank";
  if (/^GAME OVER/.test(text)) return "gameover";
  if (text === "Victory!") return "victory";
  if (/^THE END|^TO BE CONTINUED/.test(text)) return "theend";
  if (/LOADING/.test(text)) return "loading";
  if (/^Press (any key|Enter)/.test(text) || /\?\s*(\(.*\))?$/.test(text)) return "question";
  return "";
}

function addLine(text, cls) {
  const p = document.createElement("p");
  p.className = "line " + (cls ?? classify(text));
  p.textContent = text;
  screen.appendChild(p);
  return p;
}

const artEl = document.getElementById("art");
artEl.appendChild(ILL.canvas);
if (ILL.is3D) artEl.classList.add("is3d");
function go(id, say = []) {
  current = S[id];
  if (current.enter) current.enter(state);
  artEl.classList.remove("show");
  const art = SCENE_ART[id];
  ILL.showScene(typeof art === "function" ? art(state) : art);
  requestAnimationFrame(() => requestAnimationFrame(() => artEl.classList.add("show")));
  render(say);
}

function render(extra) {
  timers.forEach(clearTimeout); timers = [];
  screen.innerHTML = "";
  choicesEl.innerHTML = "";
  controls.classList.remove("show");
  field.disabled = true; field.value = "";
  const lines = [...extra, ...val(current.text)].flatMap(l => l.split("\n"));
  const els = lines.map(l => addLine(l));
  animating = true;
  skipHint.style.opacity = 1;
  els.forEach((el, i) => timers.push(setTimeout(() => el.classList.add("show"), 100 + i * DELAY)));
  timers.push(setTimeout(showControls, 100 + els.length * DELAY));
  window.scrollTo({ top: 0 });
}

function skip() {
  if (!animating) return;
  timers.forEach(clearTimeout); timers = [];
  screen.querySelectorAll(".line").forEach(e => e.classList.add("show"));
  showControls();
}

function button(label, onClick) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label;
  b.addEventListener("click", onClick);
  choicesEl.appendChild(b);
  return b;
}

function showControls() {
  animating = false;
  skipHint.style.opacity = 0;
  choicesEl.innerHTML = "";
  const ending = val(current.ending);
  const cont = val(current.cont);
  const choices = val(current.choices);

  if (ending) {
    found.add(ending); saveFound(found); updateTally();
    form.style.display = "none";
    const again = button("Play again", restart);
    const note = document.createElement("div");
    note.className = "found";
    note.textContent = `Endings found: ${found.size} / ${ALL_ENDINGS.length}`;
    choicesEl.appendChild(note);
    controls.classList.add("show");
    again.focus();
  } else if (cont) {
    form.style.display = "";
    button("Continue", () => go(cont));
    field.placeholder = "press Enter";
    controls.classList.add("show");
    field.disabled = false; field.focus();
  } else {
    form.style.display = "";
    choices.forEach(ch => button(ch.label, () => pick(ch)));
    field.placeholder = "or type: " + choices.map(ch => ch.keys[0]).join(" / ");
    controls.classList.add("show");
    field.disabled = false; field.focus();
  }
  controls.scrollIntoView({ behavior: "smooth", block: "end" });
}

function pick(ch) {
  if (ch.set) Object.assign(state, ch.set);
  const next = typeof ch.next === "function" ? ch.next(state) : ch.next;
  go(next, ch.say || []);
}

form.addEventListener("submit", e => {
  e.preventDefault();
  if (animating) return;
  const typed = field.value.trim();
  field.value = "";
  const cont = val(current.cont);
  if (cont) return go(cont);                       // "press any key"
  const choices = val(current.choices) || [];
  const match = choices.find(ch => ch.keys.includes(typed.toLowerCase()));
  if (match) return pick(match);
  if (current.fallback) return go(current.fallback);
  addLine("> " + typed, "line echo show");
  (current.err || "??????").split("\n").forEach(l => addLine(l, "line err show"));
  controls.scrollIntoView({ behavior: "smooth", block: "end" });
});

document.addEventListener("keydown", e => { if (animating) { e.preventDefault(); skip(); } });
screen.addEventListener("click", skip);
document.getElementById("restartBtn").addEventListener("click", restart);

function restart() {
  state = { hasObject: false, fell: false };
  go("start");
}

updateTally();
restart();
</script>
